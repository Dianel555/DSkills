name: CI

on:
  push:
  pull_request:

jobs:
  repo:
    name: Marketplace & skills structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate marketplace.json and SKILL.md layout
        run: python .github/scripts/validate_marketplace.py

  agent-wiki:
    name: agent-wiki (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: skills/agent-wiki
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: skills/agent-wiki/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,site]"
      - name: Ruff
        run: python -m ruff check scripts/ tests/
      - name: Mypy
        run: python -m mypy --strict scripts/agent_wiki_cli.py scripts/agent_wiki/
      - name: Pytest
        run: python -m pytest tests/ -q
